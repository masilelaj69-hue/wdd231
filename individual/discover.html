<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discover | House Vibe</title>

    <meta name="description" content="Explore House music, artists, genres, tracks, and sounds on House Vibe.">
    <meta name="author" content="Julia Masilela">

    <link rel="icon" href="images/favicon.svg">

    <meta property="og:title" content="Discover House Music on House Vibe">
    <meta property="og:description" content="Explore House music, artists, genres, and tracks on House Vibe. Discover new sounds and save your favorites.">
    <meta property="og:image" content="https://masilelaj69-hue.github.io/wdd231/individual/images/hero.webp">
    <meta property="og:url" content="https://masilelaj69-hue.github.io/wdd231/individual/discover.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <script type="module" src="scripts/main.js"></script>
    <script type="module" src="scripts/discover.js"></script>
</head>

<body>

<header>
    <div class="header-container">
        <a class="logo" href="index.html">House<span>Vibe</span></a>

        <button
            class="menu-button"
            id="menu-button"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="navigation">
            ☰
        </button>

        <nav id="navigation">
            <a href="index.html">Home</a>
            <a class="active" href="discover.html">Discover</a>
            <a href="favorites.html">Favorites</a>
        </nav>
    </div>
</header>

<main>

    <section class="page-header">
        <p class="eyebrow">Find your sound</p>
        <h1>Discover House Music</h1>
        <p>
            Explore artists, tracks, genres, and sounds from around the world.
        </p>
    </section>

    <section class="filters" aria-label="Music filters">
        <label for="search">
            Search
            <input
                type="search"
                id="search"
                placeholder="Search artist, track, genre..."
                autocomplete="off">
        </label>

        <label for="genre-filter">
            Genre
            <select id="genre-filter">
                <option value="all">All genres</option>
            </select>
        </label>
    </section>

    <section class="content-section">
        <div
            id="music-container"
            class="music-grid"
            aria-live="polite">
        </div>
    </section>

    <div
        id="music-modal"
        class="modal"
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-content">

        <div
            id="modal-content"
            class="modal-content">
        </div>

    </div>

</main>

<footer>
    <div class="footer-content">
        <div>
            <p><strong>House Vibe</strong></p>
            <p>Discover the sound. Feel the rhythm.</p>
        </div>

        <div class="footer-links">
            <a href="favorites.html">Favorites</a>
            <a href="thankyou.html">Contact</a>
            <a href="attributions.html">Attributions</a>
        </div>
    </div>

    <div class="copyright">
        <p>
            &copy; <span id="current-year"></span> Julia Masilela | South Africa
        </p>
    </div>
</footer>

</body>
</html>
