<body>
    <header>
        <div class="header-container">
            <a class="logo" href="index.html">
                House<span>Vibe</span>
            </a>

            <button
                id="menu-button"
                class="menu-button"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false">
                ☰
            </button>

            <nav id="navigation">

                <a href="favorites.html">Favorites</a>

        </div>
    </header>

    <main>
        <section class="form-section">
            <p class="eyebrow">Get in touch</p>

            <h1>Contact House Vibe</h1>

            <p>
                Tell us about your favorite House music,
                artist, or genre.
            </p>

            <form action="thankyou.html" method="get">

                <div>
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required>
                </div>

                <div>
                    <label for="favorite">Favorite House artist</label>
                    <input
                        type="text"
                        id="favorite"
                        name="favorite"
                        required>
                </div>

                <div>
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        required></textarea>
                </div>

                <button class="button" type="submit">
                    Send Message
                </button>
            </form>
        </section>
    </main>
